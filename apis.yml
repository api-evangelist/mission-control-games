name: Mission Control Games
description: >-
  Mission Control Games is a mobile game studio building casual puzzle games,
  co-founded by Kivanc Okutur (CEO) and Murat Gurel (CTO), veterans of the team
  behind Merge Dragons. Headquartered across London and Istanbul (legal entity
  Mission Control Games Yazilim Anonim Sirketi), the studio works in small teams
  to create new casual puzzle sub-genres through rapid iteration and AI-assisted
  development. It launched publicly in April 2026 alongside a $4M pre-seed round
  led by General Catalyst, with participation from Arcadia Gaming Partners and
  e2vc. The company operates a marketing website only and publishes no public
  API, developer portal, SDKs, or machine-readable developer surface as of this
  enrichment pass.
